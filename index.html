function renderTable(){var tf=document.getElementById('teamFilter').value,pf=document.getElementById('posFilter').value,filtered=PLAYERS.filter(function(p){if(tf!=='ALL'&&p.team!==tf)return false;if(pf!=='ALL'){if(pf==='F'&&p.pos!=='F')return false;if(pf==='D'&&p.pos!=='D')return false;if(pf==='G'&&p.pos!=='G')return false;}return true;});filtered.sort(function(a,b){var av=getVal(a,sortCol),bv=getVal(b,sortCol);if(typeof av==='string')return sortDir===1?av.localeCompare(bv):bv.localeCompare(av);return sortDir===1?av-bv:bv-av;});document.getElementById('tableBody').innerHTML=filtered.map(function(p,i){var rank=i+1,rc=rank===1?'rank-1':rank===2?'rank-2':rank===3?'rank-3':'rank-other',ptspg=p.gp>0?(p.pts/p.gp).toFixed(2):'0.00';return'<tr><td><span class="rank-badge '+rc+'">'+rank+'</span></td><td class="name">'+p.name+'</td><td class="team"><span class="team-badge team-'+p.tc+'">'+p.team+'</span></td><td class="pos">'+p.pos+'</td><td>'+p.gp+'</td><td>'+p.g+'</td><td>'+p.a+'</td><td><strong>'+p.pts+'</strong></td><td>'+p.ppg+'</td><td>'+p.shg+'</td><td>'+p.gwg+'</td><td>'+p.pim+'</td><td>'+ptspg+'</td></tr>';}).join('');document.getElementById('statCount').textContent=filtered.length+' players';document.querySelectorAll('thead th').forEach(function(th){var col=th.dataset.col,arrow=th.querySelector('.sort-arrow');th.classList.toggle('sorted',col===sortCol);if(arrow)arrow.textContent=col===sortCol?(sortDir===1?' up':' down'):'';});}
document.querySelectorAll('thead th[data-col]').forEach(function(th){th.addEventListener('click',function(){var col=th.dataset.col;if(col==='rank')return;if(sortCol===col){sortDir*=-1;}else{sortCol=col;sortDir=-1;}renderTable();});});
document.getElementById('teamFilter').addEventListener('change',renderTable);
document.getElementById('posFilter').addEventListener('change',renderTable);
renderTable();
</script>
</body>
</html>
