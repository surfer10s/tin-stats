.rank-badge { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; font-weight: bold; font-size: 0.85em; }
.rank-1 { background: gold; color: #000; }
.rank-2 { background: silver; color: #000; }
.rank-3 { background: #cd7f32; color: #fff; }

];

var sortCol='pts',sortDir=-1;
function getVal(p,col){if(col==='rank')return p.pts;return p[col]!==undefined?p[col]:0;}
function renderTable(){
var tf=document.getElementById('teamFilter').value;
var filtered=PLAYERS.filter(function(p){if(tf!=='ALL'&&p.team!==tf)return false;return true;});
filtered.sort(function(a,b){var av=getVal(a,sortCol),bv=getVal(b,sortCol);if(typeof av==='string')return sortDir===1?av.localeCompare(bv):bv.localeCompare(av);return sortDir===1?av-bv:bv-av;});
document.getElementById('tableBody').innerHTML=filtered.map(function(p,i){
var rank=i+1,rc=rank===1?'rank-1':rank===2?'rank-2':rank===3?'rank-3':'rank-other';
return'<tr><td><span class="rank-badge '+rc+'">'+rank+'</span></td><td class="name">'+p.name+'</td><td class="team"><span class="team-badge team-'+p.tc+'">'+p.team+'</span></td><td>'+p.gp+'</td><td>'+p.g+'</td><td>'+p.a+'</td><td><strong>'+p.pts+'</strong></td><td>'+p.ppga.toFixed(2)+'</td><td>'+p.ppg+'</td><td>'+p.shg+'</td><td>'+p.gwg+'</td><td>'+p.pim+'</td></tr>';
}).join('');
document.getElementById('statCount').textContent=filtered.length+' players';
document.querySelectorAll('thead th').forEach(function(th){var col=th.dataset.col,arrow=th.querySelector('.sort-arrow');th.classList.toggle('sorted',col===sortCol);if(arrow)arrow.textContent=col===sortCol?(sortDir===1?' ▲':' ▼'):'';});
}
document.querySelectorAll('thead th[data-col]').forEach(function(th){th.addEventListener('click',function(){var col=th.dataset.col;if(col==='rank')return;if(sortCol===col){sortDir*=-1;}else{sortCol=col;sortDir=-1;}renderTable();});});
document.getElementById('teamFilter').addEventListener('change',renderTable);
renderTable();
</script>
